
name: AICO Inbox Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  classify-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check authentication configuration
        id: auth
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: |
          if [ -z "$MS_CLIENT_ID" ] || [ -z "$MS_REFRESH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authentication is not configured. No mailbox access attempted."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Run read-only inbox classifier
        if: steps.auth.outputs.configured == 'true'
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python agent/inbox_agent.py
